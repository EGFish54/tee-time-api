<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tee Time Config</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Set Tee Time Search(es)</h1>

        <form id="teeTimeForm">
            <div id="searchRows"></div>

            <button id="addRowButton" type="button" class="secondary-button">+ Add Another Day</button>

            <button id="updateButton" type="submit">Update Config</button>
        </form>

        <!-- Scraper Pause/Resume Section -->
        <div class="input-group" style="margin-top: 20px;">
            <button id="togglePauseButton">Loading Scraper Status...</button>
        </div>
        <p id="scraperStatus" style="text-align: center; font-weight: bold; margin-top: 10px;"></p>
        <!-- End Scraper Pause/Resume Section -->

        <!-- Message display area -->
        <div id="message" class="message"></div>

        <h2>Current Config:</h2>
        <p id="currentConfig"></p>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
